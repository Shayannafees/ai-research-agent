<div class="container">
  <h2>AI Research Agent</h2>
  <div class="input-row">
    <input
      type="text"
      [(ngModel)]="question"
      placeholder="Ask anything..."
      (keydown.enter)="ask()"
    />
    <button (click)="ask()" [disabled]="isLoading">
      {{ isLoading ? 'Thinking...' : 'Ask' }}
    </button>
  </div>
  <span class="loading" *ngIf="isLoading">Searching knowledge base...</span>
  <div class="answer" *ngIf="answer" [innerHTML]="formattedAnswer"></div>
</div>
